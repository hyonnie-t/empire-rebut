<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- 포털 로그인 세션 자동 첨부(history26 v83) -->
<script src="https://hyonnie-t.github.io/history26/snippets/portal_auth.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제국주의자에게 반박하기</title>
<meta property="og:type" content="website">
<meta property="og:title" content="제국주의자에게 반박하기">
<meta property="og:image" content="https://hyonnie-t.github.io/empire-rebut/og-cover.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="671">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5-cover">
</head>
<body>
<div id="previewBar" class="preview-bar" hidden></div>
<main class="page">
  <header class="book-head">
    <div class="head-top">
      <div id="eyebrow" class="eyebrow"></div>
      <button type="button" id="wordBtn" class="word-btn" aria-expanded="false" aria-controls="wordSheet" hidden></button>
    </div>
    <h1 id="appTitle"></h1>
    <ol id="steps" class="steps" aria-label="진행 단계" hidden>
      <li data-k="pick">고르기</li>
      <li data-k="open">뜯어보기</li>
      <li data-k="ev">근거</li>
      <li data-k="write">쓰기</li>
      <li data-k="wrap">마무리</li>
    </ol>
  </header>

  <!-- S0 시작 -->
  <section id="s0" class="screen">
    <figure class="cover-banner"><img src="cover.webp" width="1200" height="671" alt="" decoding="async"></figure>
    <div class="card intro">
      <p id="introQ" class="lead"></p>
      <label for="sid">학번 (5자리, 예: 20512)</label>
      <input id="sid" inputmode="numeric" maxlength="5" autocomplete="off" data-no-draft>
      <label for="sname">이름</label>
      <input id="sname" autocomplete="off" data-no-draft>
      <p id="startErr" class="err" role="alert"></p>
      <button id="startBtn" class="btn wide">시작</button>
    </div>
  </section>

  <!-- S1 고르기: 비판할 대상 9장 -->
  <section id="s1" class="screen" hidden>
    <div class="progress">고르기</div>
    <h2 id="pickQ"></h2>
    <p id="pickHow" class="how"></p>
    <div id="pickList"></div>
    <div class="nav"><span></span><button id="s1Next" class="btn">다음</button></div>
  </section>

  <!-- S2 뜯어보기: 형광펜 + 위·아래 빈칸 -->
  <section id="s2" class="screen" hidden>
    <div class="progress">뜯어보기</div>
    <div class="split">
    <div class="col-src">
    <p id="expoWord" class="word-box" hidden></p>
    <div class="card">
      <div id="tPage" class="page-tag"></div>
      <h2 id="tTitle"></h2>
      <p id="tBook" class="book-note" hidden></p>
      <div id="tFig"></div>
      <p id="markQ" class="q first"></p>
      <p id="markHow" class="how"></p>
      <div id="markBox" class="mark-box"></div>
      <p id="markWords" class="words" hidden></p>
      <p id="markCite" class="cite"></p>
      <p id="markNote" class="note-cap"></p>
    </div>
    <div id="tCaps"></div>
    </div>
    <div class="col-write">
    <div class="card">
      <p id="frameQ" class="q first"></p>
      <div id="frameBox" class="frame-box"></div>
      <button type="button" class="hint-btn" data-hint="frameHint" aria-expanded="false">💡 막막하면 힌트 보기</button>
      <p id="frameHint" class="hint" hidden></p>
    </div>
    <p id="s2Err" class="err" role="alert"></p>
    <div class="nav"><button id="s2Prev" class="btn btn-ghost">이전</button><button id="s2Next" class="btn">다음</button></div>
    </div>
    </div>
  </section>

  <!-- S3 근거 고르기 -->
  <section id="s3" class="screen" hidden>
    <div class="progress">근거</div>
    <div class="split">
    <div class="col-src">
    <div class="pin-slot"></div>
    <h2 id="evQ"></h2>
    <button type="button" class="hint-btn top" data-hint="evHint" aria-expanded="false">💡 어디서 찾을지 막막하면</button>
    <ul id="evHint" class="hint hint-list" hidden></ul>
    <div id="evList"></div>
    </div>
    <div class="col-write">
    <p id="evEmpty" class="ev-empty">왼쪽에서 자료를 골라 봐.</p>
    <div id="evOpen" class="card" hidden>
      <div id="evPage" class="page-tag"></div>
      <h3 id="evTitle"></h3>
      <p id="evBook" class="book-note" hidden></p>
      <p id="evHow" class="how"></p>
      <div id="evSents" class="sent-list"></div>
      <p id="evWords" class="words" hidden></p>
    </div>
    <p id="s3Err" class="err" role="alert"></p>
    <div class="nav"><button id="s3Prev" class="btn btn-ghost">이전</button><button id="s3Next" class="btn">다음</button></div>
    </div>
    </div>
  </section>

  <!-- S4 쓰기 -->
  <section id="s4" class="screen" hidden>
    <div class="progress">쓰기</div>
    <div class="split">
    <div class="col-src">
    <div class="pin-slot"></div>
    </div>
    <div class="col-write">
    <div class="card">
      <label for="w1" id="w1Q" class="q first"></label>
      <textarea id="w1" rows="2"></textarea>
      <p id="w1c" class="count"></p>
      <label for="w2" id="w2Q" class="q"></label>
      <textarea id="w2" rows="2"></textarea>
      <p id="w2c" class="count"></p>
      <button type="button" class="hint-btn" data-hint="wHint" aria-expanded="false">💡 막막하면 힌트 보기</button>
      <p id="wHint" class="hint" hidden></p>
    </div>
    <p id="s4Err" class="err" role="alert"></p>
    <div class="nav"><button id="s4Prev" class="btn btn-ghost">이전</button><button id="s4Next" class="btn">다 썼어</button></div>
    </div>
    </div>
  </section>

  <!-- S5 마무리 -->
  <section id="s5" class="screen" hidden>
    <div class="progress">마무리</div>
    <div class="card">
      <h2>완성한 글</h2>
      <div id="summary" class="summary"></div>
      <p id="bodyCount" class="count"></p>
      <div class="out-row">
        <button id="copyBtn" class="btn btn-ghost">글 복사</button>
        <a id="padletBtn" class="btn btn-ghost" target="_blank" rel="noopener" hidden>우리 반 패들렛 열기</a>
      </div>
      <div class="padlet-box">
        <p id="padletNote"></p>
        <p id="padletMsg" class="note"></p>
      </div>
      <button id="submitBtn" class="btn wide">제출</button>
      <p id="outMsg" class="ok" role="status"></p>
      <p id="outErr" class="err" role="alert"></p>
    </div>
    <div class="nav"><button id="s5Prev" class="btn btn-ghost">이전</button><span></span></div>
  </section>

  <aside id="pin" class="pin" hidden></aside>
  <div id="toast" class="toast" role="status" hidden></div>

  <!-- 모르는 낱말 찾기: 화면 키보드에 가리지 않게 위쪽에 띄운다 -->
  <div id="wordSheet" class="word-sheet" role="dialog" aria-labelledby="wordTitle" data-no-gloss hidden>
    <div class="word-head">
      <span id="wordTitle" class="word-title"></span>
      <button type="button" id="wordClose" class="btn btn-ghost word-close">닫기</button>
    </div>
    <form id="wordForm" class="word-form">
      <input id="wordInput" maxlength="15" autocomplete="off" enterkeyhint="search" aria-labelledby="wordTitle" data-no-draft>
      <button class="btn">찾기</button>
    </form>
    <div id="wordResult" class="word-result" aria-live="polite"></div>
  </div>
</main>
<script src="focus_guard.js"></script>
<script src="glossary.js"></script>
<script src="draft_guard.js"></script>
<script src="data.js?v=5"></script>
<script src="word_lookup.js?v=5"></script>
<script src="app.js?v=5"></script>
</body>
</html>
